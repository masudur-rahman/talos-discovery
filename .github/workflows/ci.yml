name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 · Tests
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Includes the e2e suite: the real Talos discovery client against the
      # full server stack on loopback, plaintext and TLS. No services needed.
      - name: Run tests
        run: go test -race -coverprofile=coverage.out -count=1 ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: coverage.out
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────
  # Job 2 · Lint
  # ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # `make fmt` also regroups imports, so a clean tree afterwards proves
      # both the formatting and the import order.
      - name: Check formatting
        run: |
          make fmt
          if ! git diff --exit-code; then
            echo "run 'make fmt' and commit the result"; exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # ────────────────────────────────────────────────────────────────
  # Job 3 · Vulnerability scan
  # ────────────────────────────────────────────────────────────────
  vuln:
    name: Vuln Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ────────────────────────────────────────────────────────────────
  # Job 4 · Container build (depends on test + lint passing)
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for git describe

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Verify modules
        run: make verify

      # Both release platforms, so an arm64-only break fails here rather than
      # at tag time. Nothing is pushed.
      - name: Build container
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --cache-from type=gha,scope=app \
            --cache-to type=gha,mode=max,scope=app \
            -f Dockerfile .
