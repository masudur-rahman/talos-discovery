# Plain nginx in front of the server: TLS terminated here, plaintext to the
# backend. Needs nginx 1.25.1+ for `http2 on;` (older: `listen 443 ssl http2;`).
#
# The backend's one port speaks both protocols, so nginx only has to send each
# request the right way: gRPC paths over grpc_pass, everything else (landing
# page, /inspect, /stats, /healthz) over plain HTTP.

upstream talos_discovery {
    server talos-discovery:3000;
    # Reuse upstream connections rather than opening one per stream.
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name discovery.example.com;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The discovery API and the gRPC health service. gRPC paths are
    # /<package>.<Service>/<Method>, so these two prefixes cover every call.
    location ~ ^/(sidero\.discovery\.server\.Cluster|grpc\.health\.v1\.Health)/ {
        grpc_pass grpc://talos_discovery;

        # The server hands this back to each node as its public IP, and
        # KubeSpan uses it. The server trusts it only with
        # proxy.trustXRealIP: true (TRUST_X_REAL_IP in the compose file).
        grpc_set_header X-Real-IP $remote_addr;

        # Watch streams are open for as long as a node is up and quiet
        # between changes. The 60s defaults would cut every one of them
        # once a minute.
        grpc_read_timeout   1h;
        grpc_send_timeout   1h;
        client_body_timeout 1h;
    }

    location / {
        proxy_pass http://talos_discovery;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
