# The service on one host, e.g. a Flatcar VM, behind nginx: nginx terminates
# TLS on 443 and passes each node's address on in X-Real-IP.
#
# Put the certificate at deploy/compose/tls/tls.crt and tls.key, then:
#   docker compose -f deploy/compose/docker-compose.nginx.yml up -d
#
# Point Talos at https://<host>/. For no proxy, use docker-compose.yml instead.
#
# Variables can go in deploy/compose/.env; see .env.example there.
# Upgrade: set TAG to the new release, then `docker compose ... pull && up -d`.
services:
  talos-discovery:
    # Published by the Release workflow on every tag. Pin a version with TAG
    # (deploy/compose/.env) rather than following latest on a server.
    image: ghcr.io/masudur-rahman/talos-discovery:${TAG:-latest}
    restart: unless-stopped
    # The server drains for up to 10 s on SIGTERM, then writes its final
    # snapshot. Docker's default 10 s would kill it before that write.
    stop_grace_period: 20s
    environment:
      # nginx sets X-Real-IP from the TCP source, and port 3000 is not
      # published below, so only nginx can reach the server to send it.
      TALOS_DISCOVERY_TRUST_X_REAL_IP: "true"
      TALOS_DISCOVERY_TRUST_X_FORWARDED_FOR: "false"
      TALOS_DISCOVERY_LOG_FORMAT: json
    volumes:
      # Snapshots land in /app/data/state.binpb (on by default).
      - discovery-data:/app/data
    ports:
      # No 3000: nginx reaches it over the compose network. Publishing it would
      # let anyone send X-Real-IP and set their own KubeSpan public IP.
      # The landing page and /healthz on their own port; local only.
      - "127.0.0.1:3001:3001"
      # Prometheus. Set METRICS_BIND to an address your Prometheus can reach,
      # or leave it on loopback and scrape from the VM.
      - "${METRICS_BIND:-127.0.0.1}:2122:2122"
    logging:
      # json-file grows without limit by default, and every failed request is
      # a log line.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - talos-discovery
    ports:
      - "443:443"
    volumes:
      - ../nginx/talos-discovery.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # The image ships /app/data owned by nonroot (65532), and a new named volume
  # takes that ownership on first use.
  discovery-data:
