# The service on one host, e.g. a Flatcar VM, with Talos nodes connecting to it
# directly: no proxy in front.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d
#
# Point Talos at http://<host>:3000/. For TLS, give the server a certificate
# (the commented lines below) and use https://<host>:3000/ instead.
# Behind nginx, use docker-compose.nginx.yml instead.
#
# Variables can go in deploy/compose/.env; see .env.example there.
# Upgrade: set TAG to the new release, then `docker compose ... pull && up -d`.
services:
  talos-discovery:
    # Published by the Release workflow on every tag. Pin a version with TAG
    # (deploy/compose/.env) rather than following latest on a server.
    image: ghcr.io/masudur-rahman/talos-discovery:${TAG:-latest}
    restart: unless-stopped
    # The server drains for up to 10 s on SIGTERM, then writes its final
    # snapshot. Docker's default 10 s would kill it before that write.
    stop_grace_period: 20s
    environment:
      # Nodes reach the server directly, so no header can be trusted to carry
      # their address: anyone could send one and set their own KubeSpan public
      # IP. The TCP source address is used instead.
      TALOS_DISCOVERY_TRUST_X_REAL_IP: "false"
      TALOS_DISCOVERY_TRUST_X_FORWARDED_FOR: "false"
      TALOS_DISCOVERY_LOG_FORMAT: json
      # TLS on the server itself: mount the files below and uncomment.
      # Certificates are re-read on renewal, no restart needed.
      # TALOS_DISCOVERY_TLS_CERT_FILE: /tls/tls.crt
      # TALOS_DISCOVERY_TLS_KEY_FILE: /tls/tls.key
    volumes:
      # Snapshots land in /app/data/state.binpb (on by default).
      - discovery-data:/app/data
      # - ./tls:/tls:ro
    ports:
      # gRPC for the nodes, plus the landing page, /inspect and /stats.
      - "3000:3000"
      # The same pages and /healthz on their own port; local only.
      - "127.0.0.1:3001:3001"
      # Prometheus. Set METRICS_BIND to an address your Prometheus can reach,
      # or leave it on loopback and scrape from the VM.
      - "${METRICS_BIND:-127.0.0.1}:2122:2122"
    # Hello hands each node the source address the server sees, and KubeSpan
    # uses it as the node's public IP. Docker's published ports keep the real
    # IPv4 source, but IPv6 clients go through docker-proxy and arrive from the
    # bridge gateway unless the daemon has ip6tables on. For IPv6 nodes, use
    # host networking instead: uncomment this and drop `ports:` above.
    # network_mode: host
    logging:
      # json-file grows without limit by default, and every failed request is
      # a log line.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # The image ships /app/data owned by nonroot (65532), and a new named volume
  # takes that ownership on first use.
  discovery-data:
