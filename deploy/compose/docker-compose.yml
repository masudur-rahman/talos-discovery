# The service on one host, e.g. a Flatcar VM. Two ways to run it:
#
#   Direct (default): nodes connect to <host>:3000. Point Talos at
#   http://<host>:3000/, or give the server a certificate (see below) and use
#   https://<host>:3000/.
#     docker compose -f deploy/compose/docker-compose.yml up -d
#
#   Behind nginx: nginx terminates TLS on 443 and passes the client address on.
#   Put the certificate at deploy/compose/tls/tls.crt and tls.key, then:
#     TRUST_X_REAL_IP=true BIND=127.0.0.1 \
#       docker compose -f deploy/compose/docker-compose.yml --profile nginx up -d
#   BIND=127.0.0.1 matters: with the header trusted, anyone who can reach port
#   3000 directly could claim any address.
#
# Variables can also go in deploy/compose/.env; see .env.example there.
services:
  talos-discovery:
    build:
      context: ../..
    image: ghcr.io/masudur-rahman/talos-discovery:latest
    restart: unless-stopped
    environment:
      TALOS_DISCOVERY_TRUST_X_REAL_IP: ${TRUST_X_REAL_IP:-false}
      TALOS_DISCOVERY_LOG_FORMAT: json
      # For TLS on the server itself, mount the files and set:
      # TALOS_DISCOVERY_TLS_CERT_FILE: /tls/tls.crt
      # TALOS_DISCOVERY_TLS_KEY_FILE: /tls/tls.key
    volumes:
      # Snapshots land in /app/data/state.binpb (on by default).
      - discovery-data:/app/data
      # - ./tls:/tls:ro
    ports:
      - "${BIND:-0.0.0.0}:3000:3000"   # gRPC for the nodes, plus the site
      - "127.0.0.1:3001:3001"          # landing page and /healthz
      - "${METRICS_BIND:-127.0.0.1}:2122:2122"  # Prometheus; open it to your Prometheus host only

  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - talos-discovery
    ports:
      - "443:443"
    volumes:
      - ../nginx/talos-discovery.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro

volumes:
  # The image ships /app/data owned by nonroot (65532), and a new named volume
  # takes that ownership on first use.
  discovery-data:
