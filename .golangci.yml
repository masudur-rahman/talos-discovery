version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive

  settings:
    errcheck:
      # A deferred Close on a read that already succeeded has nothing to report
      # and nowhere to report it.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (io.ReadCloser).Close
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are a review matter here, not a gate

  exclusions:
    rules:
      # Tests may ignore errors from helpers whose failure the assertion
      # already covers.
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable:
    - gofmt
